<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">The Best Calculator Ever</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="language-selector">
            <select id="languageSelect" aria-label="Language selector">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="ar">العربية</option>
                <option value="ru">Русский</option>
            </select>
        </div>
        
        <div class="calculator">
            <h1 data-i18n="title">The Best Calculator Ever</h1>
            
            <div class="display-container">
                <div class="display-history" id="history"></div>
                <div class="display" id="display">0</div>
            </div>
            
            <div class="buttons">
                <!-- Row 1 -->
                <button class="btn btn-function" data-action="clear">C</button>
                <button class="btn btn-function" data-action="delete">⌫</button>
                <button class="btn btn-function" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>
                
                <!-- Row 2 -->
                <button class="btn btn-number" data-value="7">7</button>
                <button class="btn btn-number" data-value="8">8</button>
                <button class="btn btn-number" data-value="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>
                
                <!-- Row 3 -->
                <button class="btn btn-number" data-value="4">4</button>
                <button class="btn btn-number" data-value="5">5</button>
                <button class="btn btn-number" data-value="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>
                
                <!-- Row 4 -->
                <button class="btn btn-number" data-value="1">1</button>
                <button class="btn btn-number" data-value="2">2</button>
                <button class="btn btn-number" data-value="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>
                
                <!-- Row 5 -->
                <button class="btn btn-function" data-action="negate">±</button>
                <button class="btn btn-number" data-value="0">0</button>
                <button class="btn btn-number" data-value=".">.</button>
                <button class="btn btn-equals" data-action="equals">=</button>
            </div>
            
            <div class="advanced-buttons">
                <button class="btn btn-advanced" data-action="sqrt">√</button>
                <button class="btn btn-advanced" data-action="square">x²</button>
                <button class="btn btn-advanced" data-action="power">xʸ</button>
                <button class="btn btn-advanced" data-action="pi">π</button>
            </div>
            
            <div class="footer">
                <p data-i18n="footer">Made with ❤️ using GitHub Actions</p>
            </div>
        </div>
    </div>
    
    <script src="i18n.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
